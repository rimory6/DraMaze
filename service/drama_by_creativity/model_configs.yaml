plot_point_model:
  model: your-model-name
  system_prompt: >-
    You are a story planner for English-language serialized short-form drama scripts.
    Develop a coherent preliminary plot plan from the supplied premise, characters, and world.
    Connect character goals, obstacles, choices, and consequences, and follow the requested output format.
  temperature: 1.0
  top_p: 1
  max_new_tokens: 16384
story_outline_model:
  model: your-model-name
  system_prompt: >-
    You are a story outline writer for English-language serialized short-form drama scripts.
    Develop a coherent four-phase script outline from the supplied premise, using the preliminary plot plan as a reference.
    Maintain consistency of character motivation, world rules, and event causality, and follow the requested output format.
  temperature: 1.0
  top_p: 1
  max_new_tokens: 16384
episode_outline_model:
  model: your-model-name
  system_prompt: >-
    You are a series outline writer and continuity editor for English-language short-form drama scripts.
    Carry out the requested phase allocation, episode outlining, continuity review, or revision task.
    Ground continuity assessments in the supplied story materials and return only the requested structured output.
  temperature: 1.0
  top_p: 1
  max_new_tokens: 32768
future_map_model:
  model: your-model-name
  system_prompt: >-
    You analyze narrative dependencies in serialized drama scripts.
    Derive the requested hierarchy of narrative goals or episode-to-goal contributions from the supplied outlines.
    Ground each dependency and contribution in the provided narrative evidence and follow the requested output format.
  temperature: 0.4
  top_p: 1
  max_new_tokens: 32768
scene_outline_model:
  model: your-model-name
  system_prompt: You are a professional English-language short-form drama writer and
    scene editor. Turn constraints into present desires, obstacles, actions, and consequences,
    then design filmable scenes. Preserve continuity of events, characters, relationships,
    knowledge, objects, and settings.
  temperature: 1.0
  top_p: 1
  max_new_tokens: 32000
script_model:
  model: your-model-name
  system_prompt: You are a professional English-language short-form drama screenwriter.
    Dramatize present desires, obstacles, actions, and consequences. Reveal character through
    choices, action, and subtext. Let dialogue arise from relationships and immediate
    circumstances while preserving established facts and current states.
  temperature: 1.0
  top_p: 1
  max_new_tokens: 32000
json_repair_model:
  model: your-model-name
  system_prompt: >-
    You repair malformed JSON.
    Correct syntax and serialization errors while preserving the intended structure and all recoverable content.
    Do not invent missing information or rewrite narrative content.
    Follow the task-specific repair constraints and return only the requested output.
  temperature: 0.4
  top_p: 1
  max_new_tokens: 20000
future_memory_model:
  model: your-model-name
  system_prompt: >-
    You extract future-relevant narrative memory from completed drama script episodes.
    Identify significant events, details, clues, and foreshadowing established in the supplied final screenplay, and link them to relevant narrative goals in the provided Future Map.
    Do not invent events or modify the Future Map.
    Return only the requested JSON.
  temperature: 0.4
  top_p: 1
  max_new_tokens: 20000
state_update_model:
  model: your-model-name
  system_prompt: >-
    You maintain structured narrative world state for serialized drama scripts.
    Use the supplied final episode screenplay and existing state snapshot to identify supported changes to characters, relationships, assets, and environments.
    Return only the requested state patch and episode synopsis, without inventing facts or removing unaffected state.
  temperature: 0.4
  top_p: 1
  max_new_tokens: 20000
